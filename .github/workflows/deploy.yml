# Deploys main to Cloud Run (ADR 0001). Project, region, registry and deploy
# identity are repo variables from #5; auth is Workload Identity Federation, so
# there are no JSON keys.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in merge order.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: build, push and deploy
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_AR_REPO }}/server:${{ github.sha }}
      DOMAIN: nanders.app
      API_ORIGIN: https://api.nanders.app
      WEB_ORIGIN: https://web.nanders.app
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # The registry host is the first part of GCP_AR_REPO.
      - run: gcloud auth configure-docker "${IMAGE%%/*}" --quiet
      - run: docker build -t "$IMAGE" .
      - run: docker push "$IMAGE"
      # --set-* replace the service's whole env and secret lists, so this step
      # is their source of truth.
      - run: >-
          gcloud run deploy nando-server
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region "${{ vars.GCP_REGION }}"
          --image "$IMAGE"
          --set-secrets "MONGO_URI=nandoproject-mongo:latest,WORD_REQUESTS_TRIGGER_TOKEN=nandoproject-word-requests-trigger-token:latest,CAREER_SYNC_TRIGGER_TOKEN=nandoproject-career-sync-trigger-token:latest,TELEGRAM_WEBHOOK_SECRET=nandoproject-telegram-webhook-secret:latest,TELEGRAM_BOT_TOKEN_CORE=nandoproject-telegram-bot-token-core:latest,TELEGRAM_BOT_TOKEN_CAREER=nandoproject-telegram-bot-token-career:latest,TELEGRAM_BOT_TOKEN_JAPANESE=nandoproject-telegram-bot-token-japanese:latest,TELEGRAM_BOT_TOKEN_CALORIES=nandoproject-telegram-bot-token-calories:latest,TELEGRAM_BOT_TOKEN_TRAVEL=nandoproject-telegram-bot-token-travel:latest,TELEGRAM_BOT_TOKEN_MONEY=nandoproject-telegram-bot-token-money:latest,SERPAPI_KEY=nandoproject-serpapi-key:latest,MESSENGER_TRIGGER_TOKEN=nandoproject-messenger-trigger-token:latest"
          --set-env-vars "DOMAIN=$DOMAIN,ALLOWED_ORIGINS=$WEB_ORIGIN,TICK_AUDIENCE=${{ vars.TICK_AUDIENCE }},SCHEDULER_SERVICE_ACCOUNT=${{ vars.GCP_SCHEDULER_SA }},WORD_REQUESTS_TRIGGER_URL=${{ vars.WORD_REQUESTS_TRIGGER_URL }},CAREER_SYNC_TRIGGER_URL=${{ vars.CAREER_SYNC_TRIGGER_URL }},TELEGRAM_OWNER_ID=${{ vars.TELEGRAM_OWNER_ID }},MESSENGER_TRIGGER_URL=${{ vars.MESSENGER_TRIGGER_URL }},MONEY_STATEMENTS_BUCKET=benkyo-ferios-nando-statements"
      # Checks the CORS header, not just the status: Cloud Run's placeholder
      # image answers 200 on any path, and the header shows ALLOWED_ORIGINS
      # arrived. Retries while the domain mapping picks up the new revision.
      - name: smoke check
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS -D - -o /dev/null -H "Origin: $WEB_ORIGIN" "$API_ORIGIN/health" |
              grep -qi "^access-control-allow-origin: $WEB_ORIGIN"; then
              echo "$API_ORIGIN/health OK"
              exit 0
            fi
            sleep 5
          done
          echo "$API_ORIGIN/health did not answer as nando-server" >&2
          exit 1
