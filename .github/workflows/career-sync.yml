# The Career Sync script's tests (scripts/career-sync/), on PRs that touch it.
name: Career Sync

on:
  pull_request:
    paths:
      - scripts/career-sync/**
      - .github/workflows/career-sync.yml

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked --project scripts/career-sync pytest scripts/career-sync
